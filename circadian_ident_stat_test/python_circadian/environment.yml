name: pyscenic
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9.18      # CRITICAL FIX: Downgraded Python version
  - ipykernel
  - ipython
  - ipywidgets
  - pyqt
  - qtpy
  - sympy
  - numpy=1.23.5      # Specified version for PySCENIC compatibility
  - scipy
  - scikit-learn
  - statsmodels=0.14.2
  - igraph=0.10
  - leidenalg=0.10
  - scanpy=1.10
  - umap-learn
  - tqdm
  - matplotlib=3.9
  - seaborn
  - openpyxl
  - scikit-image
  - hdf5plugin
  - pip
  - multicore-tsne
  - pip:
    # PySCENIC and its dependencies
    - pyscenic
    # Explicitly constrain Dask components to resolve the delayed object error
    - "dask[array,dataframe,delayed,diagnostics,distributed]<=2023.10.1"