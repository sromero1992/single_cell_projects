name: timescape
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - numpy>=1.24
  - pandas>=1.5
  - scipy>=1.10
  - matplotlib>=3.7
  - seaborn>=0.12
  - scikit-learn>=1.3
  - joblib>=1.3
  - jupyter
  - ipykernel
  - pip

  - pip:
    - scanpy>=1.9
    - anndata>=0.9
    - hdf5plugin
    - leidenalg
    - python-igraph
    - -e .      # install timescape package in editable mode
